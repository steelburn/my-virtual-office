<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b13">
  <title>Provider SDK Settings - Virtual Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
  <script>try{document.documentElement.dataset.uiTheme=localStorage.getItem('vo-ui-theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.uiTheme='dark'}</script>
  <link rel="stylesheet" href="ui-standalone.css?v=20260722-3">
  <link rel="stylesheet" href="ui-themes.css?v=20260722-12">
  <link rel="stylesheet" href="provider-settings.css?v=20260806-4">
</head>
<body class="provider-settings-page">
  <header class="ps-header">
    <a class="ps-back" href="/">← Office</a>
    <div>
      <h1>Provider SDK</h1>
      <p>Connections, models, permissions, discovery, active sessions, native files, and skills.</p>
    </div>
    <div class="ps-header-actions">
      <a class="ps-button secondary" href="/models.html">Native model editor</a>
      <button id="ps-refresh" class="ps-button secondary" type="button">Refresh</button>
    </div>
  </header>
  <main class="ps-shell">
    <nav id="ps-provider-list" class="ps-provider-list" aria-label="Providers"></nav>
    <section class="ps-content">
      <div id="ps-loading" class="ps-empty">Loading Provider SDK manifests…</div>
      <div id="ps-provider" hidden>
        <div class="ps-provider-heading">
          <div>
            <div class="ps-title-row"><span id="ps-icon"></span><h2 id="ps-name"></h2><span id="ps-health" class="ps-health"></span></div>
            <p id="ps-description"></p>
          </div>
          <div class="ps-actions">
            <button id="ps-test" class="ps-button secondary" type="button">Test connection</button>
            <button id="ps-save" class="ps-button primary" type="button">Save settings</button>
          </div>
        </div>
        <div id="ps-capabilities" class="ps-capabilities"></div>
        <div id="ps-status" class="ps-status" role="status" aria-live="polite"></div>
        <form id="ps-form" novalidate></form>
      </div>
    </section>
  </main>
  <script src="provider-settings.js?v=20260806-4"></script>
</body>
</html>
